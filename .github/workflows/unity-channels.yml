# iOS + WebGL build channels via CI Mac (Lab 09 §9.4).
#
# Owner setup (one-time):
#   1. Get a Unity license file:
#      - Manual: https://game.ci/docs/github/activation — run the activation
#        workflow once with UNITY_LICENSE empty → it prints a request code →
#        license.unity3d.com/manual → paste the .ulf content into the secret.
#   2. Repo secrets:
#        UNITY_LICENSE  (contents of the .ulf)
#        UNITY_EMAIL, UNITY_PASSWORD  (for -serial activation with Pro/Plus)
#        APP_STORE_CONNECT_... (only for TestFlight upload — later milestone)
#   3. iOS needs macOS runners (this file); WebGL runs on ubuntu (second job).
#
# [RE] The rebuilt client: Assets/Scenes/... Unity 6; IL2CPP forced on iOS.
name: unity-channels

on:
  workflow_dispatch:
    inputs:
      channel:
        description: build channel
        default: webgl
        type: choice
        options: [webgl, ios, android]

jobs:
  webgl:
    if: github.event.inputs.channel == 'webgl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-WebGL-${{ hashFiles('client/Assets') }}
          restore-keys: Library-WebGL-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          projectPath: client
          unityVersion: auto        # from ProjectSettings/ProjectVersion.txt
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      # [RE] upload the WebGL build to the R2 CDN pipeline
      - name: Upload to R2
        run: server/scripts/upload_cdn.sh build/WebGL/WebGL

  ios:
    if: github.event.inputs.channel == 'ios'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-iOS-${{ hashFiles('client/Assets') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          projectPath: client
          unityVersion: auto
          # [RE] produce the Xcode project; signing/archive steps below need
          # APP_STORE secrets (TestFlight milestone) — Lab 09 §9.4.
          iosProvisioningProfileId: ${{ secrets.IOS_PROVISION_PROFILE_ID }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
