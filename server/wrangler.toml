name = "caocao-server"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object for game sessions (actor per battle/room shard)
[durable_objects]
bindings = [{ name = "GAME_SERVER", class_name = "GameServer" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameServer"]

# D1 database for player/progress storage
[[d1_databases]]
binding = "DB"
database_name = "caocao"
database_id = "local-dev-placeholder"

# R2 content bucket — WebGL/iOS asset bundles (Brotli) + catalog snapshots.
# [RE] mirrors the original design: akamaized CDN for patchable content.
[[r2_buckets]]
binding = "CDN"
bucket_name = "caocao-cdn"
